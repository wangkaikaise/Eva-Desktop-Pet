name: Windows

on:
  pull_request:
    paths:
      - "Windows/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create or update the Windows 13.3.1 GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Windows

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Windows/requirements.txt
            Windows/requirements-dev.txt

      - name: Test and build
        shell: powershell
        run: .\scripts\build_windows.ps1

      - name: Smoke-test clean application shutdown
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: .\.venv\Scripts\python.exe test_smoke_quit.py

      - name: Inspect package
        shell: powershell
        run: |
          $exe = Get-Item .\dist\EvaDesktopPet\EvaDesktopPet.exe
          $zip = Get-Item .\dist\Eva-Desktop-Pet-Windows-13.3.1-x64.zip
          Write-Host "EXE bytes: $($exe.Length)"
          Write-Host "ZIP bytes: $($zip.Length)"
          Get-FileHash -Algorithm SHA256 $zip

      - uses: actions/upload-artifact@v7
        with:
          name: Eva-Desktop-Pet-Windows-13.3.1-x64
          path: Windows/dist/Eva-Desktop-Pet-Windows-13.3.1-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v13.3.1"
          $asset = ".\dist\Eva-Desktop-Pet-Windows-13.3.1-x64.zip"
          $checksum = "$asset.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          $title = "$([char]0x4F0A)$([char]0x5A03)$([char]0x684C)$([char]0x9762)$([char]0x5BA0)$([char]0x7269) $([char]0x00B7) Windows 13.3.1"
          [IO.File]::WriteAllText($checksum, "$hash *Eva-Desktop-Pet-Windows-13.3.1-x64.zip`n", [Text.Encoding]::ASCII)
          Write-Host "Release SHA256: $hash"
          $releaseTags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json).tagName
          if ($releaseTags -contains $tag) {
            gh release upload $tag $asset $checksum --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset $checksum --title $title --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          }
